name: One manual model-free Click task diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: click-model-free-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify reviewed no-key runtime subset
        shell: bash
        run: |
          set -euo pipefail
          echo '8dbe91adb61072b7e6e772a2cf4423d4a632900fc7f3f316c93761353ab0164a  1-click-coherent-runtime-r2.tar.gz' | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/click-runtime"
          tar -xzf 1-click-coherent-runtime-r2.tar.gz -C "$RUNNER_TEMP/click-runtime" --no-same-owner --no-same-permissions
          cd "$RUNNER_TEMP/click-runtime"
          python3 -I - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          expected=json.loads((root/'runtime-subset-manifest.json').read_text())['files']
          assert {p.as_posix() for p in root.rglob('*') if p.is_file()}==set(expected)|{'runtime-subset-manifest.json'}
          for name,digest in expected.items():
              path=root/name
              assert not path.is_symlink() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          print(json.dumps({'verified_runtime_subset_files':len(expected),'real_provider_calls':0}))
          PY
      - name: Build offline inputs and run one no-key Click diagnostic
        env:
          DOCKER_BUILDKIT: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/click-runtime"
          timeout --signal=TERM --kill-after=10s 480s python3 -I proposals/click-runtime/run_diagnostic.py
# No secrets, provider requests, paid runners, uploaded artifacts, raw chats or retry.
# Known canned edit on a real public task is not a demonstrated model repair.
