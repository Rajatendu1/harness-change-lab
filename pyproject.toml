[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-change-lab"
version = "0.1.0.dev0"
description = "Paired, reproducible regression checks for coding-agent harness changes"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
harnesslab = "harnesslab.cli:main"

[tool.setuptools.packages.find]
include = ["harnesslab*"]
